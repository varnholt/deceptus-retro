name: Build GBA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Original engine revision (blank uses SOURCE_REVISION)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gba-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gba:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: console
    steps:
      - name: Check out console engine
        uses: actions/checkout@v7
        with:
          path: console
          persist-credentials: false

      - name: Select original content revision
        id: content
        env:
          ENGINE_REF: ${{ inputs.engine_ref }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          ref = os.environ.get('ENGINE_REF', '').strip() or Path('SOURCE_REVISION').read_text().strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ref=' + ref + '\n')
          PY

      - name: Check out authoritative game data
        uses: actions/checkout@v7
        with:
          repository: varnholt/deceptus_engine
          ref: ${{ steps.content.outputs.ref }}
          path: deceptus_engine
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: console/requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake ninja-build liblua5.4-dev
          python -m pip install -r requirements.txt

      - name: Prepare GBA build reference
        run: python tools/bootstrap.py --target gba

      - name: Build native engine and source fixtures
        run: |
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host

      - name: Build GBA opening from original assets
        run: python tools/build_gba.py --scene tutorial

      - name: Run native and conversion checks
        run: ctest --test-dir build/host --output-on-failure

      - name: Assemble downloadable cartridge files
        run: python tools/package_ci.py

      - name: Upload GBA cartridge
        uses: actions/upload-artifact@v7
        with:
          name: deceptus-gba-${{ github.sha }}
          path: console/build/ci/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gba-diagnostics-${{ github.run_id }}
          path: |
            console/build/host/Testing/Temporary/LastTest.log
            console/build/gba/deceptus.map
            console/build/gba/build.json
          if-no-files-found: ignore
          retention-days: 7
